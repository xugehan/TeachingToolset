[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "english-toolkit-cli"
version = "0.1.0"
description = "上海高中英语教学工具集：网页选题型生成默写纸、成绩小分条、试卷 Word、英文报阅读"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "reportlab>=4.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "streamlit>=1.40",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
english-toolkit = "english_toolkit.cli:main"
etk = "english_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
